<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shootboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="canonical" href="https://shootboard.app/tr/">
<link rel="alternate" hreflang="tr" href="https://shootboard.app/tr/">
<link rel="alternate" hreflang="en" href="https://shootboard.app/en/">
<link rel="alternate" hreflang="x-default" href="https://shootboard.app/en/">
<script>(function(){
  var H={"tr":"/tr/","en":"/en/"},V="en";
  var d=null;
  try{var q=new URLSearchParams(location.search).get("lang");if(q&&H[q])d=q;}catch(e){}
  if(!d){try{var m=localStorage.getItem("demo_ui_language");if(m&&H[m])d=m;}catch(e){}}
  if(!d){try{var n=(navigator.language||"").toLowerCase().split("-")[0];if(H[n])d=n;}catch(e){}}
  if(!d)d=V;
  location.replace(H[d]+location.hash);
})();</script>
</head>
<body>
<noscript><p>Shootboard</p><ul>
<li><a href="/tr/" hreflang="tr">🇹🇷 Türkçe</a></li>
<li><a href="/en/" hreflang="en">🇬🇧 English</a></li>
</ul></noscript>
</body>
</html>
