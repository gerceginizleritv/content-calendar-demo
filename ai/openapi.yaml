openapi: 3.1.0
info:
  title: Shootboard AI API
  version: "1"
  description: |
    Lets an AI assistant or automation read a Shootboard account and add
    plans to it: calendar entries, projects (shoots), places, scripts and
    ideas. Shootboard never publishes anything; it holds the plan.

    Authentication: the creator generates a key in Shootboard
    (Account → AI access → New key) and gives it to the assistant. Send it as
    `Authorization: Bearer shb_...` (or `x-api-key`). The key is full access
    to that account; never echo it.

    Package format: https://shootboard.app/ai/sema.json (also `GET /schema`).
    Assistant card (paste into a chat): https://shootboard.app/ai/
  contact:
    email: hello@shootboard.app
servers:
  - url: https://dyemvzmpnlpnzwebuciu.supabase.co/functions/v1/ai
security:
  - bearerKey: []
  - headerKey: []
tags:
  - name: read
  - name: write
paths:
  /me:
    get:
      operationId: getMe
      tags: [read]
      summary: Account limits, counts and language
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  lang: { type: string, description: "tr or en" }
                  today: { type: string, format: date }
                  counts: { $ref: "#/components/schemas/Counts" }
                  limits: { $ref: "#/components/schemas/Counts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /schema:
    get:
      operationId: getSchema
      tags: [read]
      summary: JSON Schema of the transfer package
      security: []
      responses:
        "200":
          description: The schema (draft 2020-12)
          content:
            application/json:
              schema: { type: object }
  /projects:
    get:
      operationId: listProjects
      tags: [read]
      summary: Projects (shoots) in the account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /places:
    get:
      operationId: listPlaces
      tags: [read]
      summary: Places (filming locations)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  places:
                    type: array
                    items: { $ref: "#/components/schemas/PlaceOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /entries:
    get:
      operationId: listEntries
      tags: [read]
      summary: Calendar entries in a date range
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Default 7 days ago.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Default 60 days ahead.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/EntryOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /scripts:
    get:
      operationId: listScripts
      tags: [read]
      summary: Scripts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scripts:
                    type: array
                    items: { $ref: "#/components/schemas/ScriptOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /ideas:
    get:
      operationId: listIdeas
      tags: [read]
      summary: Ideas board
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ideas:
                    type: array
                    items: { $ref: "#/components/schemas/IdeaOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /imports:
    get:
      operationId: listImports
      tags: [read]
      summary: Recent imports (last 20)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  imports:
                    type: array
                    items: { $ref: "#/components/schemas/ImportLog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /import:
    post:
      operationId: importPackage
      tags: [write]
      summary: Add a package to the account
      description: |
        Places first, then projects, then entries, scripts and ideas. Projects
        and places match by name (case-insensitive) and are updated rather
        than duplicated; fields the package omits are left untouched.
        Entries, scripts and ideas are created unless an `id` from an earlier
        response is given. At most 200 items per package, 60 imports per hour.
        Nothing is written when an account limit would be exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "https://shootboard.app/ai/sema.json"
            example:
              shootboard: 1
              source: ChatGPT
              note: "Istanbul hans: one shoot, two posts"
              projects:
                - name: Hans district
                  type: venue
                  shootDate: "2026-09-20"
              entries:
                - date: "2026-09-27"
                  time: "19:00"
                  type: video
                  platform: youtube
                  title: Hans of Istanbul
                  project: Hans district
                  content:
                    videoTitle: The Last Working Hans of Istanbul
                    caption: Four centuries of trade under one roof...
                - date: "2026-09-27"
                  time: "19:30"
                  type: reels
                  platform: instagram
                  title: Hans teaser
                  project: Hans district
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  importId: { type: string, description: "Pass to /undo to revert." }
                  source: { type: string }
                  note: { type: string }
                  created: { $ref: "#/components/schemas/IdLists" }
                  updated: { $ref: "#/components/schemas/IdLists" }
                  counts:
                    type: object
                    properties:
                      created: { $ref: "#/components/schemas/Counts" }
                      updated: { $ref: "#/components/schemas/Counts" }
                  warnings:
                    type: array
                    items: { $ref: "#/components/schemas/Warning" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Package rejected (invalid_package) or an account limit would be exceeded (limit); nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: More than 60 imports in the last hour.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /undo:
    post:
      operationId: undoImport
      tags: [write]
      summary: Revert an import
      description: Items the import created are removed; items it updated are restored to their previous state. Without importId the latest import is reverted.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                importId: { type: string }
      responses:
        "200":
          description: Reverted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  importId: { type: string }
                  reverted: { $ref: "#/components/schemas/Counts" }
        "404":
          description: No such import, or it is already undone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: "Authorization: Bearer shb_..."
    headerKey:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    Unauthorized:
      description: Missing, malformed or revoked key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Bad parameters.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        ok: { type: boolean, const: false }
        error: { type: string, description: "unauthorized, forbidden, not_installed, invalid_package, limit, rate_limited, bad_request, not_found, server" }
        message: { type: string }
    Counts:
      type: object
      properties:
        entries: { type: integer }
        projects: { type: integer }
        places: { type: integer }
        scripts: { type: integer }
        ideas: { type: integer }
    IdLists:
      type: object
      properties:
        entries: { type: array, items: { type: string } }
        projects: { type: array, items: { type: string } }
        places: { type: array, items: { type: string } }
        scripts: { type: array, items: { type: string } }
        ideas: { type: array, items: { type: string } }
    Warning:
      type: object
      properties:
        list: { type: string, description: "entries, projects, places, scripts, ideas or empty" }
        index: { type: integer, description: "Position in that list, -1 for the whole list" }
        message: { type: string }
    ImportLog:
      type: object
      properties:
        importId: { type: string }
        at: { type: string, format: date-time }
        source: { type: string }
        note: { type: string }
        counts:
          type: object
          properties:
            created: { $ref: "#/components/schemas/Counts" }
            updated: { $ref: "#/components/schemas/Counts" }
        ids: { $ref: "#/components/schemas/IdLists" }
        undone: { type: boolean }
    EntryOut:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        time: { type: string, description: "HH:MM or empty" }
        type: { type: string, enum: [video, shorts, reels, carousel, story, text_post, poll] }
        platform: { type: string, enum: [youtube, instagram, tiktok, facebook, threads, x, pinterest, linkedin] }
        title: { type: string }
        uploaded: { type: boolean }
        project: { type: string, description: "Project name, empty if none" }
        projectId: { type: string }
        content:
          type: object
          properties:
            caption: { type: string }
            hashtags: { type: string }
            videoTitle: { type: string }
            shortTitle: { type: string }
            thumbPrompt: { type: string }
            slidePrompts: { type: array, items: { type: string } }
            timezone: { type: string }
    ProjectOut:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [outdoor, venue, studio, vlog, review, desk, other] }
        shootDate: { type: string }
        keywords: { type: string }
        notes: { type: string }
        address: { type: string }
        places: { type: array, items: { type: string }, description: "Place names, in stop order" }
        placeIds: { type: array, items: { type: string } }
        topic: { type: string }
        city: { type: string }
        district: { type: string }
        format: { type: string }
        permission: { type: string }
        scriptUrl: { type: string }
        driveUrl: { type: string }
        mapsUrl: { type: string }
        fieldNotes: { type: string }
        cautions: { type: string }
        shotList: { type: string }
        cancelled: { type: boolean }
        steps: { type: object, additionalProperties: { type: boolean } }
        deadlines: { type: object, additionalProperties: { type: string } }
        createdAt: { type: [string, "null"] }
    PlaceOut:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        district: { type: string }
        address: { type: string }
        country: { type: string }
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        timezone: { type: string }
        mapsUrl: { type: string }
        driveUrl: { type: string }
        permission: { type: string }
        cautions: { type: string }
        notes: { type: string }
        updatedAt: { type: [string, "null"] }
    ScriptOut:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        text: { type: string }
        source: { type: string, enum: [manual, drive, ai] }
        project: { type: string }
        projects: { type: array, items: { type: string } }
        projectIds: { type: array, items: { type: string } }
        updatedAt: { type: [string, "null"] }
    IdeaOut:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        project: { type: string }
        projectIds: { type: array, items: { type: string } }
        due: { type: string }
        done: { type: boolean }
        updatedAt: { type: [string, "null"] }
