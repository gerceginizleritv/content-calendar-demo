<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube bağlantısı — Shootboard</title>
<meta name="robots" content="noindex">
<!--
  GOOGLE/YOUTUBE YETKILENDIRME DONUS SAYFASI

  Google kullaniciyi buraya `?code=...&state=...` ile geri gonderiyor.
  Bu sayfa `code`u JETONA CEVIRMIYOR: o is client_secret istiyor ve
  secret statik bir sayfada duramaz. Sayfa yalnizca `code`u Edge
  Function'a iletiyor, takas orada oluyor.

  ⚠ ADRES KAYITLIYLA BIREBIR AYNI OLMALI. Google, jeton takasindaki
  redirect_uri ile yetkilendirmedekini karsilastiriyor; bir karakter
  saparsa "redirect_uri_mismatch" ile reddediyor. Bu yuzden adres
  sorgu dizgesi ATILARAK uretiliyor (origin + pathname).

  ⚠ NEDEN app.html DEGIL DE AYRI SAYFA:
  app.html buyuk ve acilisinda takvimi kuruyor. Donus adresini oraya
  verseydik her yetkilendirme donusunde butun uygulama yeniden
  yukleniyor, `code` da adres cubugunda oyalanıyordu. Ayri sayfa
  code'u alip temizliyor ve uygulamaya geri gonderiyor.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --zemin:#F4F7FA; --kart:#FFFFFF; --metin:#141C27; --soluk:#5B6676;
    --cizgi:#DDE3EA; --vurgu:#2563C7; --iyi:#0F7B3E; --kotu:#B3261E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --zemin:#0E131A; --kart:#161D26; --metin:#EAEFF5; --soluk:#9AA6B4;
      --cizgi:#27313D; --vurgu:#6EA8FF; --iyi:#5FD08A; --kotu:#FF8A80;
    }
  }
  :root[data-theme="dark"]{
    --zemin:#0E131A; --kart:#161D26; --metin:#EAEFF5; --soluk:#9AA6B4;
    --cizgi:#27313D; --vurgu:#6EA8FF; --iyi:#5FD08A; --kotu:#FF8A80;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--zemin); color:var(--metin);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:16px;
  }
  .kart{
    background:var(--kart); border:1px solid var(--cizgi); border-radius:14px;
    padding:28px 24px; max-width:460px; width:100%;
  }
  h1{font-size:19px; margin:0 0 6px; text-wrap:balance}
  p{margin:0 0 14px; color:var(--soluk)}
  .durum{font-weight:600; color:var(--metin)}
  .iyi{color:var(--iyi)} .kotu{color:var(--kotu)}
  a.dugme{
    display:inline-block; margin-top:8px; padding:10px 16px; border-radius:9px;
    background:var(--vurgu); color:#fff; text-decoration:none; font-weight:600;
  }
  code{background:rgba(127,127,127,.14); padding:1px 5px; border-radius:5px; font-size:13px}
</style>
</head>
<body>
<main class="kart">
  <h1>YouTube bağlantısı</h1>
  <p id="durum" class="durum">Bağlantı tamamlanıyor…</p>
  <p id="ayrinti"></p>
  <a class="dugme" id="geri" href="/app.html">Shootboard'a dön</a>
</main>

<script>
(function(){
  'use strict';

  var SUPABASE_URL = 'https://dyemvzmpnlpnzwebuciu.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_QpzqwOn4BX43GtX9ecaowQ_qIlaHJA-';
  var UC = SUPABASE_URL + '/functions/v1/youtube-baglan';
  var DURUM_ANAHTARI = 'shootboard.youtube.state';

  // ⚠ ISTEMCI TEMBEL YARATILIYOR VE YOKLUGU OLUMCUL DEGIL.
  // Ustte dogrudan `window.supabase.createClient(...)` cagirmak,
  // kitaplik yuklenmediginde (CDN engeli, ag hatasi) BUTUN SAYFAYI
  // olduruyor: betik o satirda patliyor, baglama dugmesi de hata
  // mesaji da hic cikmiyor. Oysa baglamanin ilk adimi kitapliga hic
  // ihtiyac duymuyor -- yalnizca jeton takasi ve durum sorgusu duyuyor.
  var sbOnbellek = null;
  function istemci(){
    if (!window.supabase || !window.supabase.createClient) return null;
    if (!sbOnbellek) sbOnbellek = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return sbOnbellek;
  }

  var durumEl = document.getElementById('durum');
  var ayrintiEl = document.getElementById('ayrinti');

  function yaz(metin, sinif, ayrinti){
    durumEl.textContent = metin;
    durumEl.className = 'durum ' + (sinif || '');
    ayrintiEl.textContent = ayrinti || '';
  }

  // ══════════════════════════════════════════════════════════════
  // BAGLANTIYI KESME
  // ══════════════════════════════════════════════════════════════
  // ⚠ BU DUGME 29 EYLUL 2026'YA KADAR HIC YOKTU -- ve privacy.html
  // "Shootboard'un YouTube sayfasindan baglantiyi kesebilirsin" diye
  // SOZ VERIYORDU. Sunucu ucu (youtube_kes) ve `?kes=1` bastan beri
  // duruyordu; eksik olan yalnizca dugmeydi. Yani canli bir hukuki
  // belge, var olmayan bir yolu tarif ediyordu.
  //
  // YouTube API denetimi de bunun ekran goruntusunu istiyor
  // ("OAuth Flow Screenshots -- consent screen, scopes, revocation").
  function kes(){
    if (!window.confirm('YouTube baglantisi kesilecek. Planladigin yayinlar '
        + 'yeniden baglanana kadar cikmayacak. Devam edilsin mi?')) return;
    yaz('Bağlantı kesiliyor…', '', '');
    var sb = istemci();
    if (!sb) {
      yaz('Bağlantı kesilemedi.', 'kotu',
          'Sayfa tam yüklenemedi (ağ engeli olabilir). Sayfayı yenileyip yeniden dene.');
      return;
    }
    sb.auth.getSession().then(function(r){
      var oturum = r && r.data && r.data.session;
      if (!oturum) {
        yaz('Önce Shootboard\'a giriş yapmalısın.', 'kotu', '');
        return null;
      }
      // ⚠ Uc govde OKUMUYOR: `?kes=1` govdeden once donuyor.
      return fetch(UC + '?kes=1', {
        method: 'POST',
        headers: { 'authorization': 'Bearer ' + oturum.access_token }
      }).then(function(y){
        return y.json().catch(function(){ return { ok:false, sebep:'Sunucu cevabı okunamadı (' + y.status + ')' }; });
      });
    }).then(function(v){
      if (!v) return;
      if (v.ok) {
        yaz('YouTube bağlantısı kesildi.', 'iyi',
            'Saklanan jetonlar silindi. İstediğin zaman yeniden bağlayabilirsin.');
        baslat();
      } else {
        yaz('Bağlantı kesilemedi.', 'kotu', v.sebep || 'Bilinmeyen hata.');
      }
    }).catch(function(e){
      yaz('Bağlantı kesilemedi.', 'kotu', (e && e.message) || String(e));
    });
  }

  // Zaten bagliysa: baglama dugmesi yerine KESME dugmesi.
  function bagliGoster(ad){
    durumEl.textContent = 'YouTube bağlı.' + (ad ? ' (' + ad + ')' : '');
    durumEl.className = 'durum iyi';
    ayrintiEl.innerHTML = '';
    var d = document.createElement('a');
    d.className = 'dugme';
    d.href = '#';
    d.textContent = 'Bağlantıyı kes';
    d.addEventListener('click', function(e){ e.preventDefault(); kes(); });
    ayrintiEl.appendChild(d);
    var not = document.createElement('p');
    not.textContent = 'Bağlantıyı Google Hesabı ayarlarından da kaldırabilirsin. '
      + 'Kestiğinde saklanan jetonlar siliniyor.';
    ayrintiEl.appendChild(not);
  }

  // ⚠ SAYFA ONCE "BAGLI MIYIM" DIYE SORUYOR.
  // Sormadan dogrudan baglama dugmesi gosteriyordu: zaten bagli olan
  // biri bu sayfaya geldiginde yine "bagla" goruyor, kesme yolunu HIC
  // bulamiyordu. Kesme dugmesi eklenince o eksiklik asil sorun oldu.
  //
  // ⚠ DURUM SORGUSU JETON DONDURMUYOR. youtube_durum() yalnizca "bagli mi",
  // ad ve son hatayi veriyor; jetonlarin durdugu tabloyu tarayici HIC
  // goremiyor (sql/51 ve sql/52'de bilerek ilke yok).
  function baslat(){
    yaz('Hazırlanıyor…', '', '');
    var sb = istemci();
    // Kitaplik yoksa "bagli miyim" sorulamaz -- ama baglamak yine de
    // mumkun, cunku o adim yalnizca bir yonlendirme.
    if (!sb) { baglamayiGoster(); return; }
    sb.auth.getSession().then(function(r){
      var oturum = r && r.data && r.data.session;
      // Oturum yoksa durum sorulamaz; baglama akisi zaten girisi
      // isteyecek. Sessizce baglama yoluna dusuyoruz.
      if (!oturum) return null;
      return sb.rpc('youtube_durum').then(function(d){
        var satir = d && d.data && (Array.isArray(d.data) ? d.data[0] : d.data);
        return (satir && satir.bagli) ? satir : null;
      }).catch(function(){ return null; });
    }).then(function(satir){
      if (satir) { bagliGoster(satir.kanal_adi || ''); return; }
      baglamayiGoster();
    }).catch(function(){ baglamayiGoster(); });
  }

  function baglamayiGoster(){
    yaz('Hazırlanıyor…', '', '');
    fetch(UC).then(function(y){ return y.json(); }).then(function(bilgi){
      if (!bilgi || !bilgi.client_id) {
        yaz('YouTube bağlantısı şu an kurulamıyor.', 'kotu',
            'Sunucuda Google istemci kimliği tanımlı değil.');
        return;
      }
      // ⚠ STATE: rastgele ve TARAYICIDA saklanan bir deger. Donuste
      // birebir ayni degilse baglanti reddediliyor. Uretimi
      // crypto.randomUUID ile; Math.random tahmin edilebilir.
      var state = (window.crypto && window.crypto.randomUUID)
        ? window.crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(36).slice(2);
      try { sessionStorage.setItem(DURUM_ANAHTARI, state); } catch (e) {}
      try { localStorage.setItem(DURUM_ANAHTARI, state); } catch (e) {}

      // ⚠ access_type=offline VE prompt=consent BIRLIKTE OLMAK ZORUNDA.
      // Biri eksikse Google YENILEME JETONU VERMIYOR: erisim jetonu bir
      // saat sonra oluyor ve yukleme sessizce duruyor. prompt=consent,
      // hesap daha once izin vermis olsa bile jetonu yeniden verdiriyor.
      var adres = 'https://accounts.google.com/o/oauth2/v2/auth'
        + '?client_id=' + encodeURIComponent(bilgi.client_id)
        + '&scope=' + encodeURIComponent(bilgi.kapsamlar || 'https://www.googleapis.com/auth/youtube.upload')
        + '&response_type=code'
        + '&access_type=offline'
        + '&prompt=consent'
        + '&include_granted_scopes=true'
        + '&redirect_uri=' + encodeURIComponent(location.origin + location.pathname)
        + '&state=' + encodeURIComponent(state);

      durumEl.textContent = 'YouTube kanalını bağla';
      durumEl.className = 'durum';
      ayrintiEl.innerHTML = '';
      var a = document.createElement('a');
      a.className = 'dugme';
      a.href = adres;
      a.textContent = 'Google ile devam et';
      ayrintiEl.appendChild(a);
      var not = document.createElement('p');
      not.textContent = 'Shootboard videoları planladığın saatte kendi YouTube kanalına yükleyecek. '
        + 'Uygulama doğrulanana kadar Google bir uyarı ekranı gösterir; "Gelişmiş" '
        + 'altından devam edebilirsin.';
      ayrintiEl.appendChild(not);
    }).catch(function(e){
      yaz('YouTube bağlantısı şu an kurulamıyor.', 'kotu', (e && e.message) || String(e));
    });
  }

  var q = new URLSearchParams(location.search);
  var code  = q.get('code');
  var state = q.get('state');
  var hata  = q.get('error');

  // Google "iptal" halinde de buraya donuyor, code yerine error ile.
  if (hata) {
    yaz('Bağlantı tamamlanmadı.', 'kotu',
        q.get('error_description') || 'Google yetkilendirmeyi vermedi (' + hata + ').');
    return;
  }
  // ── CODE YOKSA: BAGLANTIYI BURADAN BASLATIYORUZ ────────────────
  // Sayfa hem baslangic hem donus. Ayri bir baslangic sayfasi ya da
  // app.html'e dugme koymak da olurdu; boylesi TEK YER birakiyor ve
  // yetkilendirme adresi ile donus adresi ayni dosyada duruyor --
  // ikisinin ayrismasi Google'da "redirect_uri_mismatch" demek.
  if (!code) {
    baslat();
    return;
  }

  // ⚠ STATE KONTROLU ATLANAMAZ.
  // `state` olmadan, baska bir siteden gonderilen bir `code` ile
  // kullanicinin hesabina yabanci bir YouTube kanali baglanabilirdi.
  // Degeri app.html yonlendirmeden ONCE yaziyor.
  var beklenen = null;
  try { beklenen = sessionStorage.getItem(DURUM_ANAHTARI); } catch (e) { beklenen = null; }
  if (!beklenen) {
    // Ayri sekmede acildiysa sessionStorage bos olabilir; localStorage
    // yedegi bu yuzden var.
    try { beklenen = localStorage.getItem(DURUM_ANAHTARI); } catch (e) { beklenen = null; }
  }
  if (!beklenen || !state || beklenen !== state) {
    yaz('Güvenlik kontrolü geçilemedi.', 'kotu',
        'Bağlantı isteği bu tarayıcıda başlatılmamış görünüyor. Shootboard\'a dönüp yeniden dene.');
    return;
  }
  try { sessionStorage.removeItem(DURUM_ANAHTARI); localStorage.removeItem(DURUM_ANAHTARI); } catch (e) {}

  // Kayitli adresle BIREBIR ayni olmali: sorgu dizgesi atiliyor.
  var donusAdresi = location.origin + location.pathname;

  var sbTakas = istemci();
  if (!sbTakas) {
    yaz('Bağlantı tamamlanamadı.', 'kotu',
        'Sayfa tam yüklenemedi (ağ engeli olabilir). Sayfayı yenileyip yeniden dene.');
    return;
  }
  sbTakas.auth.getSession().then(function(r){
    var oturum = r && r.data && r.data.session;
    if (!oturum) {
      yaz('Önce Shootboard\'a giriş yapmalısın.', 'kotu',
          'Giriş yaptıktan sonra YouTube bağlantısını baştan başlat.');
      return null;
    }
    return fetch(UC, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'authorization': 'Bearer ' + oturum.access_token
      },
      body: JSON.stringify({ code: code, redirect_uri: donusAdresi })
    }).then(function(y){
      return y.json().catch(function(){ return { ok:false, sebep:'Sunucu cevabı okunamadı (' + y.status + ')' }; });
    });
  }).then(function(v){
    if (!v) return;
    if (v.ok) {
      yaz('YouTube bağlandı.' + (v.kanal_adi ? ' (' + v.kanal_adi + ')' : ''), 'iyi',
          'Planladığın videolar yayın saatinde kanalına yüklenecek. Uygulama doğrulanana kadar '
          + 'yüklenen videolar YouTube tarafından private olarak kilitlenir.');
      // Adres cubugundaki `code`u temizliyoruz: gecmiste kalmasin.
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
    } else {
      yaz('Bağlantı kurulamadı.', 'kotu', v.sebep || 'Bilinmeyen hata.');
    }
  }).catch(function(e){
    yaz('Bağlantı kurulamadı.', 'kotu', (e && e.message) || String(e));
  });
})();
</script>
</body>
</html>
