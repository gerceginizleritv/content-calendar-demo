<style>
/* ⛔ KENDI RENK TANIMLARI YOK -- marka.css'ten geliyor.
   Degisken ADLARI (--bg, --accent, --text ...) aynen duruyor. */

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--kagit); color:var(--metin);
  font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:'Archivo',Impact,sans-serif;margin:0;
  letter-spacing:-.02em;text-wrap:balance;}
h1{font-weight:900;font-size:clamp(34px,6vw,60px);line-height:1.03;}
h2{font-weight:800;font-size:clamp(20px,2.2vw,24px);}
h3{font-weight:700;font-size:19px;}
p{margin:0;}
a{color:inherit;}
.sar{width:100%;max-width:1180px;margin:0 auto;padding:0 16px;}
@media(min-width:760px){ .sar{padding:0 32px;} }

/* ── Ust cubuk: ana sayfayla AYNI ────────────────────────────── */
.ust{position:sticky;top:0;z-index:50;background:rgba(23,18,42,.92);
  backdrop-filter:saturate(140%) blur(10px);color:var(--kagit);
  border-bottom:1px solid var(--cizgi-acik);}
.ust-ic{display:flex;align-items:center;gap:12px;height:62px;}
.ust-sag{display:flex;align-items:center;gap:8px;margin-left:auto;}
.dil-dug{background:transparent;border:1px solid var(--cizgi-acik);color:inherit;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
  padding:9px 12px;border-radius:9px;cursor:pointer;min-height:44px;}
.dil-dug[aria-pressed="true"]{background:var(--kagit);color:var(--gece);border-color:var(--kagit);}

/* ── Tepe blogu ──────────────────────────────────────────────── */
.tepe{
  background:
    radial-gradient(760px 420px at 86% -16%, rgba(107,60,240,.5), transparent 62%),
    radial-gradient(620px 420px at 2% 112%, rgba(255,61,127,.3), transparent 60%),
    var(--gece);
  color:var(--kagit);padding:clamp(40px,6vw,76px) 0 clamp(34px,5vw,56px);
}
.tepe .rozet{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
  letter-spacing:1.1px;text-transform:uppercase;color:var(--jel-lime);
  padding:7px 13px;border-radius:999px;border:1px solid currentColor;
  background:transparent;margin-bottom:16px;
}
/* ⚠ Adi .alt DEGIL: sayfanin alt bilgisi de .alt ve onun padding'i
   buraya siziyordu. Ana sayfada ayni hata yakalanmisti. */
.tepe-alt{margin-top:16px;font-size:clamp(16px,1.8vw,18.5px);
  color:rgba(255,249,240,.82);max-width:36em;}

/* ── Secici dugmeler ─────────────────────────────────────────── */
.secici{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
.grup{display:inline-flex;background:rgba(255,249,240,.1);
  border:1px solid var(--cizgi-acik);border-radius:12px;padding:4px;gap:4px;}
.grup button{
  font:inherit;font-size:14.5px;font-weight:600;min-height:44px;padding:10px 18px;
  border:0;border-radius:9px;background:transparent;color:var(--kagit);cursor:pointer;
}
.grup button[aria-pressed="true"]{background:var(--sinyal);color:var(--gece);}
.indirim{margin-top:14px;font-size:14px;color:var(--jel-lime);font-weight:600;min-height:21px;}

/* ── Kartlar ─────────────────────────────────────────────────── */
.bolum{padding:clamp(44px,6vw,76px) 0;}
.durum{color:var(--metin-soluk);font-size:15px;}
.kartlar{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fit,minmax(272px,1fr));
  align-items:start;
  /* ⚠ Rozet kutunun USTUNE tasiyor; kirpilmasin diye yer birakiliyor. */
  padding-top:16px;
}
.kart{
  position:relative;                 /* rozetin dayanagi */
  border:1px solid var(--cizgi);border-radius:var(--yuvarlak);
  background:var(--yuzey);padding:28px 24px;
  display:flex;flex-direction:column;box-shadow:var(--golge);
}
.kart.onerilen{border-color:var(--sinyal);border-width:2px;padding:27px 23px;}

/* ⛔ ROZET AKIStan CIKTI ve bu ISIN KENDISI.
   Önce kutunun ICINDE, baslikla ayni akistaydi: yalnizca BIR kartta
   oldugu icin o kartin basligini ve altindaki her seyi asagi itiyordu
   ve iki kart HIZASIZ goruniyordu. Kullanici bildirdi:
   "sağ ve soldaki yazılar birbirinin hizasında değil ... Önerileni
    kutu dışına kutunun üst kısmına al."
   position:absolute ile akistan cikti: artik iki kartin da basligi
   ayni yerden basliyor. */
.kart .rozet{
  position:absolute;top:0;left:24px;transform:translateY(-50%);
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.09em;
  color:var(--kagit);background:var(--sinyal-metin);
  padding:5px 11px;border-radius:999px;white-space:nowrap;
}
.kart h2{margin:0 0 6px;}
.kart .tanim{font-size:14px;color:var(--metin-soluk);margin:0 0 18px;min-height:42px;}
.fiyat{font-family:'Archivo',sans-serif;font-size:clamp(30px,3.4vw,40px);
  font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:0;}
.fiyat small{font-size:.9rem;font-weight:500;color:var(--metin-soluk);letter-spacing:0;}
.fiyat-alt{font-size:13px;color:var(--metin-soluk);margin:4px 0 18px;min-height:20px;}
.kalan{font-size:13px;color:var(--sinyal-metin);font-weight:600;margin:0 0 12px;}
.kart ul{list-style:none;margin:0 0 22px;padding:0;font-size:15px;flex:1;}
.kart li{padding:7px 0 7px 24px;position:relative;}
.kart li::before{content:'';position:absolute;left:6px;top:15px;
  width:7px;height:7px;border-radius:50%;background:var(--sinyal);}

/* ── Dugmeler (ana sayfanin dugme dili) ──────────────────────── */
.btn{
  font:inherit;font-size:15.5px;font-weight:600;min-height:52px;padding:14px 20px;
  border:2px solid var(--cizgi);border-radius:12px;background:transparent;
  color:var(--metin);cursor:pointer;text-align:center;text-decoration:none;
  display:flex;align-items:center;justify-content:center;
  transition:transform .14s ease, box-shadow .14s ease;
}
.btn:hover{transform:translateY(-2px);}
/* ⛔ Birincil dugmede yazi KOYU, beyaz degil: beyaz bu turuncuda 3.12
   ediyor ve govde esigi 4.5. Koyu ile 5.82. Olculdu. */
.btn-ana{background:var(--sinyal);border-color:var(--sinyal);color:var(--gece);
  box-shadow:0 5px 0 var(--sinyal-koyu);}
.btn-ana:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sinyal-koyu);}
.btn-sm{min-height:42px;padding:10px 16px;font-size:14.5px;border-radius:10px;
  border-color:transparent;background:var(--sinyal);color:var(--gece);
  box-shadow:0 4px 0 var(--sinyal-koyu);white-space:nowrap;}
/* ⚠ Dar ekranda uzun etiket ust cubugu 8px TASIRIYORDU. Gizlemek
   yerine kisaltildi: kaydirmadan gorunen tek cagri dugmesi o. */
.cta-kisa{display:none;}
@media(max-width:640px){
  .cta-uzun{display:none;}
  .cta-kisa{display:inline;}
  .btn-sm{padding:10px 13px;}
  .dil-dug{padding:9px 9px;}
  .ust-ic{gap:8px;}
}
/* Alt bilgideki baglantilar esnek satirda artik satir ici DEGIL;
   parmakla basiliyorlar, dokunma hedefi verilmeli. */
.alt-ic a{min-height:44px;display:inline-flex;align-items:center;}
@media (prefers-reduced-motion:reduce){ .btn:hover,.btn:active{transform:none;} }

/* ── Notlar ──────────────────────────────────────────────────── */
.notlar{display:grid;gap:16px;}
@media(min-width:820px){ .notlar{grid-template-columns:1fr 1fr;} }
.not{background:var(--yuzey);border:1px solid var(--cizgi);
  border-radius:var(--yuvarlak);padding:26px 24px;box-shadow:var(--golge);}
.not h3{margin:0 0 10px;}
.not p{font-size:15px;color:var(--metin-soluk);margin:0 0 8px;}
.not p:last-child{margin-bottom:0;}

/* ── Alt bilgi ───────────────────────────────────────────────── */
.alt{background:var(--gece);color:rgba(255,249,240,.66);padding:34px 0 44px;font-size:14.5px;}
.alt-ic{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;}
.alt a{text-decoration:none;}
.alt a:hover{text-decoration:underline;}
:focus-visible{outline:3px solid var(--sinyal);outline-offset:3px;border-radius:4px;}
</style>
</head>

const $ = (id)=> document.getElementById(id);
const esc = (s)=>{ const d=document.createElement('div');
  d.textContent = (s===undefined||s===null)?'':s; return d.innerHTML; };

// ⛔ METINLERDE YASAK SOZLER YOK: "sorunsuz", "zahmetsizce", "tek
// tikla", "devrim" (MARKA.md ses tonu). Uydurma kullanici sayisi,

// ⛔ OTOMATIK YAYIN HICBIR YERDE GECMIYOR: sahibin kendi ozel

const M = {
  tr: {
    uygulama_kisa:"Aç",
    tepe_rozet:"Hesapsız başla — kart istemiyoruz",
    uygulama:'Uygulamayı aç', baslik:'Fiyatlar', aylik:'Aylık', yillik:'Yıllık',
    alt:'Bir çekimden çıkan on paylaşımı tek yerden yönetmek için. Hesap açmadan denemeye başlayabilirsin.',
    ucretsiz_bas:'Ücretsiz olan ne?',
    ucretsiz_1:'Starter planı para istemiyor ve hesap da istemiyor. Takvim o tarayıcıda kalır, hiçbir sunucuya gitmez.',

    sartlar:'Kullanım şartları', gizlilik:'Gizlilik', kilavuz:'Kılavuz',
    onerilen:'Önerilen', ayda:'/ay', yilda:'yıllık ödemede',
    sec:'Başla', ucretsizSec:'Ücretsiz başla',
    yillikYok:'Bu planın yıllık fiyatı yok.',
    yuzde:(n)=> '%' + n,
    indirimMetin:(y)=> 'Yıllık ödemede ' + y + ' kadar daha ucuz.',

    yukleniyor:'Fiyatlar yükleniyor…',
    olmadi:'Fiyatlar yüklenemedi. Ağ bağlantını kontrol edip sayfayı yenile.',
    kutuphaneYok:'Sayfa yüklenemedi. Ağ bağlantını kontrol edip sayfayı yenile.',
    tanim:{ starter:'Denemeye başlamak için.',
            creator_pro:'Tek başına çalışan üretici için.',
            studio:'Ekipler ve küçük ajanslar için.',
            founding:'Lansmana özel, tek seferlik ödeme.' },
    ozellik:{
      // ⛔ YALNIZCA VAR OLAN OZELLIKLER. PDF/CSV disa aktarma ve ekip
      // ozellikleri burada YOK: ozellik denetiminde YOK ciktilar
      // (tasarim/ozellik-denetimi.md). Yapildiklarinda eklenecek.
      starter:['Hesapsız, tarayıcıda çalışır','Takvim ve "tek çekim, çok paylaşım" görünümü',
               'Fikirler, scriptler, mekanlar','Çekim listesi ve hazır setler'],
      creator_pro:['Starter’daki her şey','Bulut: masaüstünde planla, sahada telefondan aç',
                   'Sınırsız proje, script ve fikir','Sınırsız malzeme kütüphanesi',
                   'Mekana bağlı izin ve dikkat notları'],
      studio:['Creator Pro’daki her şey'],
      founding:['Creator Pro’nun tamamı','Ömür boyu erişim','Tek seferlik ödeme']
    }
  },
  en: {
    uygulama_kisa:"Open",
    tepe_rozet:"Start without an account — no card needed",
    uygulama:'Open the app', baslik:'Pricing', aylik:'Monthly', yillik:'Yearly',
    alt:'For running the ten posts that come out of one shoot from a single place. You can start without an account.',
    ucretsiz_bas:'What stays free?',
    ucretsiz_1:'Starter asks for no money and no account. The calendar stays in that browser and reaches no server.',

    yukleniyor:'Loading prices…',
    olmadi:'Prices could not be loaded. Check your connection and reload.',

      starter:['Works in the browser, no account','Calendar and the "one shoot, many posts" view',

// ⚠ PARA BIRIMI TARAYICININ DILINDEN SECILIYOR, UCUNCU BIR SERVISTEN
// DEGIL. Promptun uyarisi: "Konum tahmini icin kullanicinin adresini
// ucuncu bir servise gondereceksen once kullaniciya soyle ve gizlilik
// metnine yaz." Buradan hicbir yere bir sey gonderilmiyor:
// navigator.language tarayicinin kendi ayari. Kullanici dugmeyle
// degistirebiliyor.
const trMi = /^tr\b/i.test(navigator.language || '');
// Uygulama kendi dilini adreste gonderiyor (?lang=tr|en). Sebep:
// uygulamayi Turkce kullanan ama tarayicisi Ingilizce olan kisi, bu
// sayfaya Ingilizce dusuyordu. Adreste gecerli bir deger yoksa eski
// davranis aynen duruyor: tarayicinin dili.
// ⚠ PARA BIRIMI ADRESTEN ALINMIYOR. Dil ne OKUDUGUNU, para birimi
// NEREDE ODEYECEGINI soyluyor; ikisi ayri sorular. Para birimi yine
// tarayicinin dilinden baslayip dugmeyle degisiyor.
let adresDili = null;
try{
  const q = new URLSearchParams(location.search).get('lang');
  if(q === 'tr' || q === 'en') adresDili = q;
}catch(e){}
let dil = adresDili || (trMi ? 'tr' : 'en');
let para = trMi ? 'TRY' : 'USD';
let donem = 'monthly';
let veri = null;

function metinleriYaz(){
  const m = M[dil];
  document.documentElement.lang = dil;
  document.querySelectorAll('[data-m]').forEach(el=>{
    const d = m[el.dataset.m];
    if(typeof d === 'string') el.textContent = d;
  });
  document.querySelectorAll('[data-dil]').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.dil === dil)));
  document.title = 'Shootboard — ' + m.baslik;
}

// Kurus/cent -> okunur. ⚠ Bolme kullanilmiyor: bolum ve kalan ayri
// alinip birlestiriliyor (ondalik aritmetigi para hatasi uretir).
function paraYaz(minor, birim){
  const n = Math.max(0, Math.trunc(Number(minor) || 0));
  const tam = Math.floor(n / 100), kus = n % 100;
  const tamMetin = tam.toLocaleString(dil === 'tr' ? 'tr-TR' : 'en-US');
  const sayi = kus === 0 ? tamMetin
    : tamMetin + (dil === 'tr' ? ',' : '.') + String(kus).padStart(2, '0');
  return birim === 'TRY' ? sayi + ' TL' : '$' + sayi;
}

function fiyatBul(plan, birim, d){
  return (veri.fiyatlar || []).find(x=>
    x.plan_key === plan && x.currency === birim && x.period === d && x.active !== false);
}

function ciz(){
  const m = M[dil];
  metinleriYaz();
  if(!veri) return;

  // ⚠ INDIRIM YUZDESI SABIT YAZILMIYOR, FIYATLARDAN HESAPLANIYOR.
  // Promptun sarti. Kullanicinin soyledigi "%22" yalnizca Creator
  // Pro'da tutuyor; Studio'da baska cikiyor. Sayfa her planin kendi
  // oranini degil, GORUNEN planlar arasindaki EN KUCUK indirimi
  // yaziyor -- boylece hicbir plan icin abartilmis olmuyor.
  const oranlar = [];
  (veri.planlar || []).forEach(p=>{
    const a = fiyatBul(p.key, para, 'monthly'), y = fiyatBul(p.key, para, 'yearly');
    if(a && y && a.amount_minor > 0){
      const aylikYillik = y.amount_minor / 12;
      if(aylikYillik < a.amount_minor) oranlar.push(1 - aylikYillik / a.amount_minor);
    }
  });
  $('indirim').textContent = oranlar.length
    ? m.indirimMetin(m.yuzde(Math.round(Math.min(...oranlar) * 100)))
    : '';

  $('kartlar').innerHTML = (veri.planlar || []).map(p=>{
    const f = fiyatBul(p.key, para, donem)
      || fiyatBul(p.key, para, 'once')
      || fiyatBul(p.key, para, 'monthly');
    if(!f) return '';
    const tekSeferlik = f.period === 'once';
    const aylikEs = donem === 'yearly' && f.period === 'yearly'
      ? Math.round(f.amount_minor / 12) : null;
    const ucretsiz = f.amount_minor === 0;
    const kontenjan = p.key === 'founding' ? veri.kontenjan : null;
    const kalanAdet = kontenjan ? Math.max(0, kontenjan.quota - kontenjan.sold) : null;

    return '<div class="kart' + (p.badge === 'recommended' ? ' onerilen' : '') + '">'
      + (p.badge === 'recommended' ? '<span class="rozet">' + esc(m.onerilen) + '</span>' : '')
      + '<h2>' + esc(({starter:'Starter', creator_pro:'Creator Pro',
                       studio:'Studio', founding:dil==='tr'?'Kurucu Üye':'Founding Member'})[p.key] || p.key) + '</h2>'
      + '<p class="tanim">' + esc(m.tanim[p.key] || '') + '</p>'
      + '<p class="fiyat">' + esc(paraYaz(aylikEs !== null ? aylikEs : f.amount_minor, para))
      + (ucretsiz || tekSeferlik ? '' : '<small>' + esc(m.ayda) + '</small>') + '</p>'
      + '<p class="fiyat-alt">'
      + (aylikEs !== null ? esc(m.yilda) + ' · ' + esc(paraYaz(f.amount_minor, para)) : '')
      + '</p>'
      + (kalanAdet !== null
          ? '<p class="kalan">' + esc(kalanAdet > 0 ? m.kalan(kalanAdet, kontenjan.quota) : m.doldu) + '</p>'
          : '')
      + '<ul>' + (m.ozellik[p.key] || []).map(x=> '<li>' + esc(x) + '</li>').join('') + '</ul>'
      // ⛔ ODEME HENUZ YOK. Dugme uygulamaya goturuyor; "satin al"
      // yazmiyor ve olmayan bir akis vaat etmiyor. Odeme kurulunca
      // buraya baglanacak.
      + '<a class="btn' + (p.badge === 'recommended' ? ' btn-ana' : '') + '" href="app.html">'
      + esc(ucretsiz ? m.ucretsizSec : m.sec) + '</a>'
      + '</div>';
  }).join('');
}

async function yukle(){
  if(!sb){ $('durum').textContent = M[dil].kutuphaneYok; metinleriYaz(); return; }
  $('durum').textContent = M[dil].yukleniyor;
  try{
    const [pl, fi, ko] = await Promise.all([
      sb.from('plans').select('key,visible,badge,sort').eq('visible', true).order('sort'),
      sb.from('plan_prices').select('plan_key,currency,period,amount_minor,active'),
      sb.from('founding_seats').select('quota,sold,open').eq('id', true).maybeSingle()
    ]);
    if(pl.error || fi.error) throw (pl.error || fi.error);
    veri = {
      // ⛔ YALNIZCA GORUNUR PLANLAR. Studio ve Kurucu Uye bugun
      // visible=false: ozellik denetiminde maddelerinin cogu YOK
      // cikti. "Olmayan ozellik satilmaz" -- gorunur yapmak yonetim
      // ekranindan, kod dagitimi gerekmeden.
      planlar: pl.data || [],
      fiyatlar: fi.data || [],
      kontenjan: (ko && ko.data && ko.data.open) ? ko.data : null
    };
    $('durum').textContent = '';
    ciz();
  }catch(e){
    console.error('[fiyatlar]', e);
    $('durum').textContent = M[dil].olmadi;
    metinleriYaz();
  }
}

document.querySelectorAll('[data-dil]').forEach(b=>
  b.addEventListener('click', ()=>{ dil = b.dataset.dil; ciz(); }));
$('paraSecici').addEventListener('click', e=>{
  const b = e.target.closest('[data-para]'); if(!b) return;
  para = b.dataset.para;
  $('paraSecici').querySelectorAll('button').forEach(x=>
    x.setAttribute('aria-pressed', String(x === b)));
  ciz();
});
$('donemSecici').addEventListener('click', e=>{
  const b = e.target.closest('[data-donem]'); if(!b) return;
  donem = b.dataset.donem;
  $('donemSecici').querySelectorAll('button').forEach(x=>
    x.setAttribute('aria-pressed', String(x === b)));
  ciz();
});
// Acilista secili para birimi tarayici diline gore.
$('paraSecici').querySelectorAll('button').forEach(x=>
  x.setAttribute('aria-pressed', String(x.dataset.para === para)));
metinleriYaz();
yukle();
</script>
